// Switch language at the same point in the movie. If that language's copy isn't made yet, play the
// converted stream in that language straight away and have the laptop make the copy meanwhile,
// so switching never means waiting for a whole movie to be copied.
async function switchAudio(n) {
  const p = player;
  if (!p) return;
  closeAudioMenu();
  const a = p.i.audios[n];
  try {
    localStorage.setItem(pk('aud:' + p.i.id), String(n));
    if (a && a.lang && a.lang !== 'und') localStorage.setItem(pk('audioLang'), a.lang);
  } catch {}
  if (n === p.audio) return;
  const { i, m } = p;
  const at = p.v.currentTime || null;
  teardownVideo();
  $('stage').innerHTML = `<div class="stage" style="background-image:url('/thumb/${i.id}?size=hero')"><div class="shade"><div class="spinner"></div></div></div>`;
  const source = pickSource(i);
  if (source === 'hls' || (source === 'direct' && n === 0)) return startSource(i, m, n, at);
  const status = await (await fetch('/api/status/' + i.id + audioQuery(n))).json().catch(() => ({}));
  if (status.state === 'ready') return play(i, m, 'file', at, n);
  fetch('/api/prepare/' + i.id + audioQuery(n), { method: 'POST' }).catch(() => {});
  play(i, m, 'hls', at, n);
}

function fmtClock(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
}

function osdHtml(i, m, kind, audio = 0) {
  const title = esc(m.show ? `${m.show} · ${m.epLabel}` : i.title);
  return `<div class="osd">
    <h3>${title}</h3>
    <div class="osd-bar" id="osdBar"><div class="buf" id="osdBuf"></div><div class="fill" id="osdFill"></div></div>
    <div class="osd-row">
      <button class="btn" data-osd="back">⟲ 10s</button>
      <button class="btn btn-play" data-osd="toggle" id="osdToggle">Pause</button>
      <button class="btn" data-osd="fwd">10s ⟳</button>
      <button class="btn" data-osd="restart">↺ Start over</button>
      ${boostAvailable(kind) ? `<button class="btn" data-osd="boost" id="osdBoost">${boostLabel()}</button>` : ''}
      ${i.audios && i.audios.length > 1 ? `<button class="btn" data-osd="audio" id="osdAudio">Audio: ${esc((i.audios[audio] || i.audios[0]).label)}</button>` : ''}
      ${i.subs.length ? '<button class="btn" data-osd="cc" id="osdCC">Subtitles: Off</button>' : ''}
      <button class="btn" data-osd="quality" id="osdQuality">Quality: ${esc(qualityLabel(kind, i))}</button>
      ${kind === 'file' && i.videoCodec === 'hevc' ? '<button class="btn" data-osd="compat">Picture missing?</button>' : ''}
      <span class="time" id="osdTime"></span>
    </div>
  </div>`;
}

function teardownVideo() {
  if (!player) return;
  player.timers.forEach(clearTimeout);
  if (player.hls) player.hls.destroy();
  if (player.boost) player.boost.src.disconnect();
  const v = player.v;
  v.pause();
  v.removeAttribute('src');
  v.load();
  player = null;
}

function play(i, m, kind, startAt, audio = 0) {
  teardownVideo();
  const tracks = i.subs.map((s) => `<track kind="subtitles" src="/subs/${i.id}/${s.key}.vtt" srclang="${esc(s.lang.slice(0, 2))}" label="${esc(s.label)}">`).join('');
  // The 4K HDR stream is HEVC too: same safety net (button, frozen-picture check, fall back to SDR).
  const hdrStream = kind === 'hls' && qualityFor(i) === 2160 && hdrFor(i);
  const hevcFile = (kind === 'file' && i.videoCodec === 'hevc') || hdrStream;
  const multiAudio = i.audios && i.audios.length > 1;
  // TVs, and anyone who got here with arrow keys, get HOMEFLIX's own controls: the browser's are
  // usually out of reach for a remote.
  const remote = IS_TV || usingKeys;
  const topActions = !remote
    ? `<div class="top-actions">
        <button class="pill" data-restart>↺ Start over</button>
        ${boostAvailable(kind) ? `<button class="pill" data-boost>${boostPill()}</button>` : ''}
        ${multiAudio ? `<button class="pill" data-audio-menu>🔊 ${esc((i.audios[audio] || i.audios[0]).label)}</button>` : ''}
        <button class="pill" data-quality-menu>⚙ ${esc(qualityLabel(kind, i))}</button>
        ${hevcFile ? '<button class="pill" data-compat>Picture missing?</button>' : ''}
      </div>`
    : '';
  $('stage').innerHTML = `<video id="v" ${remote ? '' : 'controls'} playsinline autoplay preload="auto" poster="/thumb/${i.id}?size=hero">${tracks}</video>
    <div class="buffering"><div class="spinner"></div><div>${kind === 'hls' ? 'Converting for this device…' : 'Loading…'}</div></div>
    ${topActions}`;
  const v = $('v');
  const p = (player = { v, i, m, kind, audio, hls: null, timers: [] });
  const watch = $('watch');
  const saved = store.get(i.id);
  const resumeAt = startAt != null ? startAt : saved && saved.time > 30 && saved.time < saved.duration - 120 ? saved.time : 0;

  if (kind === 'hls' && !nativeHls()) {
    loadHlsLib().then((Hls) => {
      if (player !== p) return;
      if (!Hls.isSupported()) return showPlayError('This browser can’t play this movie. Try another browser, or AirPlay from an iPhone or iPad.');
      const retry = { maxNumRetry: 6, retryDelayMs: 1000, maxRetryDelayMs: 8000 };
      const h = new Hls({ startPosition: resumeAt || -1, maxBufferLength: 40, fragLoadPolicy: { default: { maxTimeToFirstByteMs: 60000, maxLoadTimeMs: 120000, timeoutRetry: retry, errorRetry: retry } } });
      p.hls = h;
      h.on(Hls.Events.ERROR, (_e, d) => {
        if (!d.fatal) return;
        // The 4K HDR stream on a browser that can't decode it after all: play 4K SDR, and remember.
        if (hdrStream && d.type === Hls.ErrorTypes.MEDIA_ERROR && /codec|incompatible|buffer(Add|Append)/i.test(d.details || '')) return toCompatible();
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) h.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
        else showPlayError();
      });
      h.loadSource(withKey(hlsUrl(i, audio)));
      h.attachMedia(v);
    }).catch(() => showPlayError('Couldn’t load the player. Check that the laptop is awake and HOMEFLIX is running.'));
  } else {
    v.src = withKey(kind === 'hls' ? hlsUrl(i, audio) : `/video/${i.id}${audioQuery(audio)}`);
    if (resumeAt) v.addEventListener('loadedmetadata', () => { v.currentTime = resumeAt; }, { once: true });
  }

  // "Converting…" / "Loading…" only when a wait lasts long enough to notice.
  let waitTimer = null;
  v.addEventListener('waiting', () => { clearTimeout(waitTimer); waitTimer = setTimeout(() => watch.classList.add('waiting'), 700); p.timers.push(waitTimer); });
  for (const ev of ['playing', 'canplay', 'seeked', 'pause']) v.addEventListener(ev, () => { clearTimeout(waitTimer); watch.classList.remove('waiting'); });
  v.addEventListener('play', () => { watch.classList.add('playing'); showOsd(); });
  v.addEventListener('pause', () => { watch.classList.remove('playing'); showOsd(); });

  let last = 0;
  // Skip once the player is torn down (no duration), or leaving would reset the position to 0.
  const save = () => { if (v.duration && v.currentTime) store.set(i.id, { time: v.currentTime, duration: v.duration, at: Date.now() }); };
  v.addEventListener('timeupdate', () => { if (Math.abs(v.currentTime - last) >= 5) { last = v.currentTime; save(); } });
  v.addEventListener('pause', save);

  // HEVC the device can't really decode: switch to the H.264 stream, and remember for next time.
  if (hevcFile) {
    v.addEventListener('error', () => { if (player === p && v.error && v.error.code >= 3) toCompatible(); });
    // No picture, or a picture frozen on the first frame while the sound carries on (common on
    // Android TVs whose chip can't keep up with HEVC): every 2 seconds, check new frames are shown.
    const frames = () => {
      const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
      return q ? { total: q.totalVideoFrames, dropped: q.droppedVideoFrames } : { total: v.webkitDecodedFrameCount, dropped: v.webkitDroppedFrameCount || 0 };
    };
    let prev = null, strikes = 0;
    p.timers.push(setInterval(() => {
      if (player !== p) return;
      if (v.paused || v.seeking || v.readyState < 3 || document.hidden) { prev = null; strikes = 0; return; }
      const now = { t: v.currentTime, ...frames() };
      if (!Number.isFinite(now.total)) return; // this browser can't tell us
      if (prev) {
        const played = now.t - prev.t;
        const shown = now.total - prev.total - (now.dropped - prev.dropped);
        const stuck = played > 1.5 && (v.videoWidth === 0 || shown < played * 3); // fewer than 3 frames a second
        strikes = stuck ? strikes + 1 : 0;
        if (strikes >= 2) return toCompatible();
      }
      prev = now;
    }, 2000));
  }
  v.addEventListener('error', () => { if (player === p && !(hevcFile && v.error && v.error.code >= 3)) showPlayError(); });

  if (remote) attachOsd(p);

  // Series: offer the next episode near the end, and roll into it when this one finishes.
  const eps = m.show ? shows.get(m.show) : null;
  const next = eps ? eps[eps.findIndex((e) => e.id === i.id) + 1] : null;
  if (next) {
    let shown = false;
    v.addEventListener('timeupdate', () => {
      if (shown || !v.duration || v.duration - v.currentTime > 60) return;
      shown = true;
      $('stage').insertAdjacentHTML('beforeend', `<div class="next-up"><button class="btn btn-play" data-play="${next.id}">${ICON_PLAY}Next Episode</button></div>`);
      if (usingKeys) $('stage').querySelector('.next-up .btn').focus({ preventScroll: true });
    });
    v.addEventListener('ended', () => { location.replace('#/watch/' + next.id); });
  }
  v.play().catch(() => {});
  if (boostWanted()) applyBoost();
}

function toCompatible() {
  if (!player) return;
  const { i, m, v } = player;
  try { localStorage.setItem(hevcKey(i.tenBit), 'no'); } catch {}
  play(i, m, 'hls', v.currentTime || null, player.audio);
}

function showPlayError(msg) {
  if (!$('stage').querySelector('.shade')) {
    $('stage').insertAdjacentHTML('beforeend', `<div class="shade"><div class="error">${esc(msg || 'The video stopped loading. Check that the laptop is awake and HOMEFLIX is running.')}</div></div>`);
  }
}

// HOMEFLIX's own player controls, for TV remotes (arrow buttons or a pointer like LG's Magic Remote).
function attachOsd(p) {
  const { v, i, m, kind } = p;
  if (p.osd) return;
  p.osd = true;
  v.controls = false;
  const top = $('stage').querySelector('.top-actions');
  if (top) top.remove(); // the controls have their own Audio and "Picture missing?" buttons
  $('stage').insertAdjacentHTML('beforeend', osdHtml(i, m, kind, p.audio) +'<div class="osd-hint" id="osdHint">OK: pause · ◀ ▶: skip 10s · ▲ ▼: controls</div>');
  const update = () => {
    if (player !== p) return;
    const d = v.duration || i.duration || 0;
    $('osdFill').style.width = d ? `${(v.currentTime / d) * 100}%` : '0';
    const b = v.buffered.length ? v.buffered.end(v.buffered.length - 1) : 0;
    $('osdBuf').style.width = d ? `${Math.min(100, (b / d) * 100)}%` : '0';
    $('osdTime').textContent = `${fmtClock(v.currentTime)} / ${fmtClock(d)}`;
    $('osdToggle').textContent = v.paused ? '▶ Play' : '❚❚ Pause';
  };
  for (const ev of ['timeupdate', 'progress', 'play', 'pause', 'loadedmetadata']) v.addEventListener(ev, update);
  update();
  // Pointer remotes and mice: clicking the picture pauses, clicking the bar jumps to that point.
  v.addEventListener('click', togglePlay);
  $('osdBar').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    if (!v.duration || !r.width) return;
    v.currentTime = Math.max(0, Math.min(v.duration - 1, ((e.clientX - r.left) / r.width) * v.duration));
    showOsd();
  });
  showOsd();
  if (usingKeys) $('osdToggle').focus({ preventScroll: true });
}

// The controls fade out while playing; any key, pointer movement or click brings them back.
let osdTimer = null;
function showOsd() {
  const p = player;
  if (!p || !p.osd) return;
  const watch = $('watch');
  watch.classList.remove('osd-hidden');
  clearTimeout(osdTimer);
  osdTimer = setTimeout(() => {
    if (player !== p || p.v.paused) return;
    if ($('audioSheet')) return showOsd(); // stay up while the language menu is open
    watch.classList.add('osd-hidden');
    if (document.activeElement && document.activeElement.closest('#watch')) document.activeElement.blur();
    // The first time they fade, say how to get them back.
    if (!p.hinted && usingKeys && $('osdHint')) {
      p.hinted = true;
      $('osdHint').classList.add('on');
      p.timers.push(setTimeout(() => $('osdHint') && $('osdHint').classList.remove('on'), 4000));
    }
  }, 4500);
}
$('watch').addEventListener('pointermove', showOsd);
$('watch').addEventListener('pointerdown', showOsd);

// ---------- volume boost ----------
// Films mixed quietly for cinemas can be too quiet on phone and TV speakers, which (unlike VLC)
// can't go above 100%. Boost makes them louder on this device: Web Audio evens out the peaks with
// a compressor, raises the level, and a limiter stops distortion. The stream itself is untouched,
// so sound stays in time with the picture. Remembered per device.
const BOOST_GAIN = 1.4; // with the compressor's own make-up gain: about +8 dB overall
let audioCtx = null;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const IS_SAFARI = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
const boostWanted = () => { try { return localStorage.getItem(pk('boost')) === '1'; } catch { return false; } };
// Safari's own HLS player goes silent when its sound is routed through Web Audio.
const boostAvailable = (kind) => !!AudioCtx && !(kind === 'hls' && nativeHls() && IS_SAFARI);
const boostLabel = () => `Volume boost: ${boostWanted() ? 'On' : 'Off'}`;

// The pill says "Boost: On" on narrow screens and "Volume boost: On" elsewhere.
const boostPill = () => `${boostWanted() ? '🔊' : '🔈'} <span class="wide">Volume boost</span><span class="narrow">Boost</span>: ${boostWanted() ? 'On' : 'Off'}`;

function updateBoostButtons() {
  document.querySelectorAll('#watch .pill[data-boost]').forEach((b) => (b.innerHTML = boostPill()));
  if ($('osdBoost')) $('osdBoost').textContent = boostLabel();
}

function applyBoost() {
  const p = player;
  if (!p || p.boost || !boostWanted() || !boostAvailable(p.kind)) return updateBoostButtons();
  audioCtx = audioCtx || new AudioCtx();
  // Browsers only let Web Audio play after a tap or click. Routing the video into a context that
  // isn't running would mute it, so wait until it runs.
  if (audioCtx.state !== 'running') {
    audioCtx.resume().then(() => { if (player === p && audioCtx.state === 'running') applyBoost(); }).catch(() => {});
    const retry = () => audioCtx.resume().then(() => { if (player === p) applyBoost(); }).catch(() => {});
    document.addEventListener('pointerdown', retry, { once: true, capture: true });
    document.addEventListener('keydown', retry, { once: true, capture: true });
    return updateBoostButtons();
  }
  const src = audioCtx.createMediaElementSource(p.v);
  // Measured on a quiet film: about +8 dB louder, loudest peaks around 0.7 of full scale. (Web
  // Audio compressors add their own make-up gain, hence the trim at the end.)
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -24; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.25;
  const gain = audioCtx.createGain();
  gain.gain.value = BOOST_GAIN;
  const limiter = audioCtx.createDynamicsCompressor();
  limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.1;
  const trim = audioCtx.createGain();
  trim.gain.value = 0.8;
  src.connect(comp).connect(gain).connect(limiter).connect(trim).connect(audioCtx.destination);
  p.boost = { src, out: trim };
  updateBoostButtons();
}

function toggleBoost() {
  try { localStorage.setItem(pk('boost'), boostWanted() ? '0' : '1'); } catch {}
  const p = player;
  if (!p) return;
  if (boostWanted()) applyBoost();
  // Off: reload the video at the same point, so the sound is back to exactly what the stream carries.
  else if (p.boost) play(p.i, p.m, p.kind, p.v.currentTime || null, p.audio);
  else updateBoostButtons();
  showOsd();
}

// Back to 0:00 and play.
function startOver() {
  const v = $('v');
  if (!v) return;
  v.currentTime = 0;
  v.play().catch(() => {});
  showOsd();
}

function seek(by) {
  const v = $('v');
  if (!v) return;
  const d = v.duration || Infinity;
  v.currentTime = Math.max(0, Math.min(d - 1, v.currentTime + by));
  showOsd();
}
function togglePlay() {
  const v = $('v');
  if (!v) return;
  v.paused ? v.play().catch(() => {}) : v.pause();
  showOsd();
}
function cycleSubtitles() {
  const v = $('v');
  if (!v) return;
  const t = [...v.textTracks];
  const cur = t.findIndex((x) => x.mode === 'showing');
  t.forEach((x) => (x.mode = 'disabled'));
  const nextIdx = cur + 1 < t.length ? cur + 1 : -1;
  if (nextIdx >= 0) t[nextIdx].mode = 'showing';
  const btn = $('osdCC');
  if (btn) btn.textContent = 'Subtitles: ' + (nextIdx >= 0 ? t[nextIdx].label : 'Off');
  showOsd();
}

function closePlayer() {
  clearInterval(pollTimer);
  clearTimeout(osdTimer);
  teardownVideo();
  $('stage').innerHTML = '';
  $('watch').classList.remove('on', 'playing', 'waiting', 'osd-hidden');
  document.body.classList.remove('lock');
  document.title = 'HOMEFLIX';
}

function leavePlayer() {
  history.length > 1 && location.hash ? history.back() : (location.hash = '');
}

// Android: turn the phone sideways for full-screen video.
document.addEventListener('fullscreenchange', () => {
  const o = screen.orientation;
  if (!o || !o.lock) return;
  if (document.fullscreenElement) o.lock('landscape').catch(() => {});
  else if (o.unlock) o.unlock();
});

// ---------- remote control & keyboard ----------
let usingKeys = IS_TV; // focus rings and auto-focus only for remote/keyboard users
document.addEventListener('pointerdown', () => { if (!IS_TV) usingKeys = false; }, true);

function keyName(e) {
  const k = e.key, c = e.keyCode;
  if (k === 'ArrowLeft' || k === 'Left' || c === 37) return 'Left';
  if (k === 'ArrowRight' || k === 'Right' || c === 39) return 'Right';
  if (k === 'ArrowUp' || k === 'Up' || c === 38) return 'Up';
  if (k === 'ArrowDown' || k === 'Down' || c === 40) return 'Down';
  if (k === 'Enter' || k === 'Select' || k === 'Accept' || c === 13 || c === 23) return 'Enter'; // 23: D-pad centre on some Android TVs
  if (k === ' ' || k === 'Spacebar') return 'Space';
  // Escape/Backspace on keyboards; GoBack (Android TV), 10009 (Samsung Tizen), 461 (LG webOS)
  if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack' || c === 10009 || c === 461) return 'Back';
  if (k === 'MediaPlayPause' || c === 179 || c === 10252) return 'PlayPause';
  if (k === 'MediaPlay' || c === 415) return 'Play';
  if (k === 'MediaPause' || c === 19) return 'Pause';
  if (k === 'MediaFastForward' || c === 417) return 'FastForward';
  if (k === 'MediaRewind' || c === 412) return 'Rewind';
  return null;
}

const isShown = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden'; };
function focusables() {
  const scope = ($('lock').classList.contains('on') && $('lock')) || ($('login').classList.contains('on') && $('login')) || ($('profiles').classList.contains('on') && $('profiles')) || $('audioSheet') || ($('watch').classList.contains('on') ? $('watch') : $('modal').classList.contains('on') ? $('modal') : document);
  return [...scope.querySelectorAll('button:not([disabled]), input, [tabindex="0"]')].filter((el) => !el.closest('#watch.osd-hidden .osd') && isShown(el) && (scope !== document || !el.closest('#watch, #modal')));
}

// Move focus to the nearest item in that direction, like a TV remote.
function moveFocus(dir) {
  const items = focusables();
  const cur = items.includes(document.activeElement) ? document.activeElement : null;
  if (!cur) return focusEl(items.find((el) => el.matches('.btn-play')) || items[0]);
  const a = cur.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of items) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect();
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const dx = bx - ax, dy = by - ay;
    let main, side;
    if (dir === 'right') { if (b.left < a.right - 2 && dx <= 1) continue; main = dx; side = Math.abs(dy); }
    else if (dir === 'left') { if (b.right > a.left + 2 && dx >= -1) continue; main = -dx; side = Math.abs(dy); }
    else if (dir === 'down') { if (b.top < a.bottom - 2 && dy <= 1) continue; main = dy; side = Math.abs(dx); }
    else { if (b.bottom > a.top + 2 && dy >= -1) continue; main = -dy; side = Math.abs(dx); }
    if (main <= 0) continue;
    // Left/right stays in its row; up/down prefers what's straight above or below.
    const score = dir === 'left' || dir === 'right' ? main + side * 4 : main + side * 0.6;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) focusEl(best);
}

function focusEl(el) {
  if (!el) return;
  el.focus({ preventScroll: true });
  if (el.closest('#watch')) return;
  if (el.closest('#hero') || el.closest('header')) { if (!$('modal').classList.contains('on')) window.scrollTo({ top: 0, behavior: IS_TV ? 'auto' : 'smooth' }); return; }
  el.scrollIntoView({ block: 'center', inline: 'center', behavior: IS_TV ? 'auto' : 'smooth' });
}

// Back: close the popup, leave the player, or clear the search.
function goBack() {
  if ($('login').classList.contains('on')) return true; // nothing behind it to go back to
  if ($('profiles').classList.contains('on')) {
    if (editing) { editing = null; drawProfiles(); }
    else if (profMode === 'manage') { profMode = 'pick'; drawProfiles(); }
    else if (profile) hideProfiles();
    return true;
  }
  if (closeAudioMenu()) return true;
  if ($('modal').classList.contains('on')) { closeModal(); return true; }
  if ($('watch').classList.contains('on')) { leavePlayer(); return true; }
  if ($('search').value) { $('search').value = ''; setSearch(''); return true; }
  return false;
}

function playerKey(k, e) {
  // A remote on a TV we didn't recognise: switch from the browser's controls to ours.
  // That first press only brings up the controls (focused on Pause), or pauses/skips as asked.
  if (player && !player.osd && ['Left', 'Right', 'Up', 'Down', 'Enter'].includes(k)) {
    attachOsd(player);
    if (k === 'Left' || k === 'Right') seek(k === 'Left' ? -10 : 10);
    else if (k === 'Enter') togglePlay();
    $('osdToggle').focus({ preventScroll: true });
    return true;
  }
  const inControls = document.activeElement && document.activeElement !== document.body && document.activeElement.closest('#watch') && document.activeElement.tagName === 'BUTTON';
  const controlsShown = player && player.osd && !$('watch').classList.contains('osd-hidden');
  switch (k) {
    case 'Left':
    case 'Right':
      if (controlsShown && inControls) { moveFocus(k.toLowerCase()); showOsd(); return true; }
      if (e.target.tagName === 'VIDEO' && !(player && player.osd)) return false; // the browser's own controls seek
      seek(k === 'Left' ? -10 : 10);
      return true;
    case 'Up':
    case 'Down':
      if (!player || !player.osd) return false;
      showOsd();
      if (inControls) moveFocus(k.toLowerCase());
      else ($('osdToggle') || document.querySelector('#watch .back')).focus({ preventScroll: true });
      return true;
    case 'Enter':
      if (inControls) return false; // the focused button handles it
      togglePlay();
      return true;
    case 'Space':
      if (inControls || e.target.tagName === 'VIDEO') return false;
      togglePlay();
      return true;
    case 'PlayPause': togglePlay(); return true;
    case 'Play': $('v') && $('v').play(); showOsd(); return true;
    case 'Pause': $('v') && $('v').pause(); showOsd(); return true;
    case 'FastForward': seek(30); return true;
    case 'Rewind': seek(-30); return true;
  }
  return false;
}

document.addEventListener('keydown', (e) => {
  const k = keyName(e);
  if (!k) return;
  const typing = e.target.tagName === 'INPUT';
  if (k === 'Back') {
    if (typing && e.key === 'Backspace') return;
    if (goBack()) e.preventDefault();
    return;
  }
  if (['Left', 'Right', 'Up', 'Down'].includes(k)) usingKeys = true;
  if ($('watch').classList.contains('on')) { if (playerKey(k, e)) e.preventDefault(); return; }
  if (typing && (k === 'Left' || k === 'Right' || k === 'Space')) return;
  if (['Left', 'Right', 'Up', 'Down'].includes(k)) { e.preventDefault(); moveFocus(k.toLowerCase()); return; }
  if (k === 'Enter' && document.activeElement && document.activeElement.matches('[tabindex="0"]:not(a)')) { e.preventDefault(); document.activeElement.click(); }
  if (k === 'Enter' && document.activeElement && document.activeElement.matches('nav a')) { e.preventDefault(); document.activeElement.click(); }
});

// ---------- routing & events ----------
function route() {
  if (!user) return showLogin();
  if (!profile) return showProfiles();
  // #/watch/<id> resumes where this device stopped; #/watch/<id>/start starts over from 0:00.
  const m = location.hash.match(/^#\/watch\/(\w+)(\/start)?/);
  if (m && m[2]) history.replaceState(history.state, '', '#/watch/' + m[1]); // reloading then resumes, not restarts
  if (m) return openMovie(m[1], !!m[2]);
  closePlayer();
  loadLibrary().then(() => {
    // Back from the player with a remote: land on the title you were on.
    if (!usingKeys) return;
    const el = (returnFocus && document.querySelector(`#home [data-play="${returnFocus}"]`)) || document.querySelector('#hero .btn-play');
    if (el) focusEl(el);
  });
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-hero],[data-play],[data-show],[data-col],[data-list],[data-profiles],[data-info],[data-close],[data-home],[data-jump],[data-back],[data-osd],[data-compat],[data-audio],[data-audio-menu],[data-audio-close],[data-quality],[data-quality-menu],[data-restart],[data-boost]');
  if (!t) { if (e.target === $('modal')) closeModal(); return; }
  if (t.dataset.hero !== undefined) {
    renderHero(heroPicks[+t.dataset.hero], true); startHeroRotation(); return;
  }
  if (t.dataset.play) {
    const target = '#/watch/' + t.dataset.play + ('fromStart' in t.dataset ? '/start' : '');
    // From the popup or a finished episode, replace that history entry so Back returns home.
    if ((history.state && history.state.modal) || $('watch').classList.contains('on')) { closeModal(true); location.replace(target); }
    else location.hash = target;
  }
  else if (t.dataset.show) openModal({ show: t.dataset.show });
  else if (t.dataset.col) openModal({ col: t.dataset.col });
  else if (t.dataset.list) toggleList(t.dataset.list);
  else if ('profiles' in t.dataset) showProfiles();
  else if (t.dataset.quality !== undefined) setQuality(Number(t.dataset.quality));
  else if ('qualityMenu' in t.dataset) openQualityMenu();
  else if (t.dataset.info) openModal({ id: t.dataset.info });
  else if ('close' in t.dataset) closeModal();
  else if ('back' in t.dataset) leavePlayer();
  else if ('compat' in t.dataset) toCompatible();
  else if (t.dataset.audio) switchAudio(Number(t.dataset.audio));
  else if ('audioMenu' in t.dataset) openAudioMenu();
  else if ('audioClose' in t.dataset) closeAudioMenu();
  else if ('restart' in t.dataset) startOver();
  else if ('boost' in t.dataset) toggleBoost();
  else if (t.dataset.osd) {
    ({ back: () => seek(-10), fwd: () => seek(10), toggle: togglePlay, cc: cycleSubtitles, compat: toCompatible, audio: openAudioMenu, quality: openQualityMenu, restart: startOver, boost: toggleBoost })[t.dataset.osd]();
  }
  else if ('home' in t.dataset) { $('search').value = ''; setSearch(''); location.hash = ''; window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (t.dataset.jump) {
    const el = $(t.dataset.jump);
    if (el) {
      window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 80, behavior: 'smooth' });
      const first = el.querySelector('.card');
      if (first && usingKeys) first.focus({ preventScroll: true });
    }
  }
});

function setSearch(q) {
  $('home').style.display = q ? 'none' : '';
  $('results').classList.toggle('on', !!q);
  q ? renderResults(q) : renderHome();
}
$('search').addEventListener('input', () => setSearch($('search').value.trim().toLowerCase()));
$('searchBox').addEventListener('click', () => { $('searchBox').classList.add('open'); $('search').focus(); });
$('search').addEventListener('focus', () => $('searchBox').classList.add('open'));
$('search').addEventListener('blur', () => { if (!$('search').value) $('searchBox').classList.remove('open'); });
window.addEventListener('scroll', () => $('bar').classList.toggle('solid', scrollY > 40), { passive: true });
window.addEventListener('hashchange', route);

// ---------- profiles screen ----------
const PROFILE_COLORS = ['#e50914', '#2d7ff9', '#1db954', '#f5a623', '#9b59b6', '#16a5a5', '#e84393', '#7f8c8d'];
const initial = (n) => ([...String(n || '').trim()][0] || '?').toUpperCase();
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) {
    if (d.login) { showLogin(); throw new Error('Sign in first.'); }
    showLock();
    throw new Error('PIN needed');
  }
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Try again.');
  return d;
}
const profileKey = () => 'profile:' + (user ? user.id : '');
async function loadProfiles() {
  const d = await api('/api/profiles');
  profiles = d.profiles || [];
  maxProfiles = d.max || 6;
  if (d.user) user = d.user;
  const saved = lsGet(profileKey());
  profile = profiles.find((p) => p.id === saved) || (profiles.length === 1 ? profiles[0] : null);
  drawAvatar();
  return profile;
}
function drawAvatar() {
  const a = $('avatar');
  a.style.display = profile ? '' : 'none';
  if (!profile) return;
  a.style.background = profile.color;
  a.textContent = initial(profile.name);
  a.title = `${profile.name}: switch profile`;
  a.setAttribute('aria-label', a.title);
}
let profMode = 'pick'; // pick | manage
let editing = null; // the profile being edited ({} when adding one)
function showProfiles(mode = 'pick') {
  profMode = mode;
  editing = null;
  closeModal();
  stopCardPreview();
  $('profiles').classList.add('on');
  document.body.classList.add('lock');
  drawProfiles();
}
function hideProfiles() {
  $('profiles').classList.remove('on');
  if (!$('modal').classList.contains('on') && !$('watch').classList.contains('on')) document.body.classList.remove('lock');
}
function drawProfiles(msg = '') {
  const box = $('profBox');
  if (editing) {
    const isNew = !editing.id;
    editing.color = editing.color || PROFILE_COLORS.find((c) => !profiles.some((p) => p.color === c)) || PROFILE_COLORS[0];
    box.className = 'prof-box';
    box.innerHTML = `<h1>${isNew ? 'Add profile' : 'Edit profile'}</h1>
      <div class="prof-form">
        <div class="prof"><div class="face" id="profFace" style="background:${editing.color}">${esc(initial(editing.name))}</div></div>
        <input id="profName" maxlength="20" placeholder="Name" value="${esc(editing.name || '')}" autocomplete="off" aria-label="Profile name">
        <div class="swatches">${PROFILE_COLORS.map((c) => `<button class="swatch ${c === editing.color ? 'on' : ''}" style="background:${c}" data-swatch="${c}" aria-label="Colour ${c}"></button>`).join('')}</div>
        <div class="prof-actions" style="margin-top:6px">
          <button class="btn btn-play" data-prof-save>Save</button>
          ${!isNew && profiles.length > 1 ? '<button class="btn btn-ghost" data-prof-delete>Delete profile</button>' : ''}
          <button class="btn btn-ghost" data-prof-cancel>Cancel</button>
        </div>
      </div>
      <div class="prof-msg" role="alert">${esc(msg)}</div>`;
    $('profName').addEventListener('input', () => { editing.name = $('profName').value; $('profFace').textContent = initial(editing.name); });
    $('profName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); box.querySelector('[data-prof-save]').click(); } });
    $('profName').focus({ preventScroll: true });
    return;
  }
  const manage = profMode === 'manage';
  box.className = 'prof-box' + (manage ? ' manage' : '');
  box.innerHTML = `<div class="logo">HOMEFLIX</div>
    <h1>${manage ? 'Manage profiles' : 'Who’s watching?'}</h1>
    <div class="prof-grid">
      ${profiles.map((p) => `<button class="prof" data-prof="${p.id}"><div class="face" style="background:${p.color}">${esc(initial(p.name))}</div>${esc(p.name)}</button>`).join('')}
      ${profiles.length < maxProfiles ? '<button class="prof add" data-prof-add><div class="face">+</div>Add profile</button>' : ''}
    </div>
    ${manage || profiles.length >= maxProfiles ? `<div class="prof-count">${profiles.length} of ${maxProfiles} profiles${profiles.length >= maxProfiles ? ' · that’s the most an account can have' : ''}</div>` : ''}
    <div class="prof-msg" role="alert">${esc(msg)}</div>
    <div class="prof-actions">
      <button class="btn btn-ghost" data-prof-manage>${manage ? 'Done' : 'Manage profiles'}</button>
      ${profile ? `<button class="btn btn-ghost" data-prof-previews>Autoplay previews: ${previewsOn() ? 'On' : 'Off'}</button>` : ''}
      <button class="btn btn-ghost" data-sign-out>Sign out</button>
    </div>
    ${user ? `<div class="signed-in">Signed in as <b>${esc(user.username)}</b></div>` : ''}`;
  if (usingKeys) focusEl(box.querySelector(`[data-prof="${profile ? profile.id : ''}"]`) || box.querySelector('.prof'));
}
function chooseProfile(p) {
  profile = p;
  lsSet(profileKey(), p.id);
  drawAvatar();
  hideProfiles();
  homeDrawn = false;
  heroKey = '';
  window.scrollTo(0, 0);
  route();
}
$('profiles').addEventListener('click', async (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  try {
    if (t.dataset.prof) {
      const p = profiles.find((x) => x.id === t.dataset.prof);
      if (!p) return;
      if (profMode === 'manage') { editing = { ...p }; return drawProfiles(); }
      return chooseProfile(p);
    }
    if ('profAdd' in t.dataset) { editing = {}; return drawProfiles(); }
    if ('signOut' in t.dataset) return signOut();
    if ('profManage' in t.dataset) { profMode = profMode === 'manage' ? 'pick' : 'manage'; return drawProfiles(); }
    if ('profPreviews' in t.dataset) {
      lsSet(pk('previews'), previewsOn() ? '0' : '1');
      if (!previewsOn()) { stopHeroPreview(); stopCardPreview(); }
      t.textContent = `Autoplay previews: ${previewsOn() ? 'On' : 'Off'}`;
      return;
    }
    if (t.dataset.swatch) {
      editing.color = t.dataset.swatch;
      $('profFace').style.background = editing.color;
      $('profBox').querySelectorAll('.swatch').forEach((b) => b.classList.toggle('on', b === t));
      return;
    }
    if ('profCancel' in t.dataset) { editing = null; return drawProfiles(); }
    if ('profSave' in t.dataset) {
      const body = { name: $('profName').value.trim(), color: editing.color };
      const saved = editing.id ? await api('/api/profiles/' + editing.id, body) : await api('/api/profiles', body);
      const current = profile && profile.id;
      await loadProfiles();
      if (current && !profile) profile = profiles.find((p) => p.id === current) || null;
      drawAvatar();
      editing = null;
      // A new profile from the picker: start watching as them.
      if (profMode === 'pick' && !editing && saved && saved.id && !current) return chooseProfile(profiles.find((p) => p.id === saved.id));
      return drawProfiles();
    }
    if ('profDelete' in t.dataset) {
      if (!confirm(`Delete ${editing.name}? Their My List goes too.`)) return;
      await api(`/api/profiles/${editing.id}/delete`, {});
      if (profile && profile.id === editing.id) { profile = null; lsSet(profileKey(), ''); }
      editing = null;
      await loadProfiles();
      return drawProfiles();
    }
  } catch (err) {
    drawProfiles(err.message);
  }
});

// ---------- sign in / create an account ----------
let loginMode = 'signin'; // signin | signup
function showLogin(msg = '') {
  closePlayer();
  closeModal();
  stopCardPreview();
  stopHeroPreview();
  $('profiles').classList.remove('on');
  $('login').classList.add('on');
  document.body.classList.add('lock');
  drawLogin(msg);
}
function hideLogin() {
  $('login').classList.remove('on');
  document.body.classList.remove('lock');
}
function drawLogin(msg = '') {
  const signup = loginMode === 'signup';
  const keep = $('loginUser') ? $('loginUser').value : '';
  $('loginBox').innerHTML = `<div class="logo">HOMEFLIX</div>
    <h1>${signup ? 'Create an account' : 'Sign in'}</h1>
    <form id="loginForm" novalidate>
      <input id="loginUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="24" placeholder="Username" aria-label="Username" value="${esc(keep)}">
      <input id="loginPass" name="password" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" maxlength="128" placeholder="Password" aria-label="Password">
      ${signup ? `<input id="loginPass2" type="password" autocomplete="new-password" maxlength="128" placeholder="Password again" aria-label="Password again">
      <p class="hint">Usernames are 3–24 letters or numbers. Passwords need at least 6 characters. Each account can have up to 6 profiles.</p>` : ''}
      <button class="btn btn-play" type="submit">${signup ? 'Create account' : 'Sign in'}</button>
    </form>
    <div class="prof-msg" role="alert" id="loginMsg">${esc(msg)}</div>
    <div class="prof-actions"><button class="btn btn-ghost" data-login-mode>${signup ? 'Have an account? Sign in' : 'New here? Create an account'}</button></div>`;
  $('loginForm').addEventListener('submit', submitLogin);
  (keep ? $('loginPass') : $('loginUser')).focus({ preventScroll: true });
}
async function submitLogin(e) {
  e.preventDefault();
  const signup = loginMode === 'signup';
  const username = $('loginUser').value.trim().toLowerCase();
  const password = $('loginPass').value;
  if (!username || !password) return ($('loginMsg').textContent = 'Enter a username and password.');
  if (signup && password !== $('loginPass2').value) {
    $('loginMsg').textContent = 'The passwords don’t match. Type them again.';
    $('loginPass').value = '';
    $('loginPass2').value = '';
    $('loginPass').focus();
    return;
  }
  const btn = $('loginForm').querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    const r = await fetch(signup ? '/api/signup' : '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401 && d.pin) return showLock();
    if (!r.ok) {
      $('loginMsg').textContent = d.error || 'That didn’t work. Try again.';
      $('loginPass').value = '';
      if ($('loginPass2')) $('loginPass2').value = '';
      $('loginPass').focus();
      return;
    }
    lsSet('session', d.token);
    user = d.user;
    hideLogin();
    boot();
  } catch {
    $('loginMsg').textContent = 'Can’t reach the computer. Is HOMEFLIX running?';
  } finally {
    btn.disabled = false;
  }
}
$('login').addEventListener('click', (e) => {
  if (!e.target.closest('[data-login-mode]')) return;
  loginMode = loginMode === 'signup' ? 'signin' : 'signup';
  drawLogin();
});
async function signOut() {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  lsSet('session', '');
  user = null;
  profile = null;
  profiles = [];
  movies = [];
  heroKey = '';
  homeDrawn = false;
  $('rows').innerHTML = '';
  renderHero(null);
  drawAvatar();
  location.hash = '';
  loginMode = 'signin';
  showLogin();
}

// ---------- PIN ----------
const PIN_MAX = 8;
let pin = '';
function drawPin(msg) {
  $('pinDots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, n) => `<i class="${n < pin.length ? 'on' : ''}"></i>`).join('');
  if (msg !== undefined) $('pinMsg').textContent = msg;
  $('keypad').querySelector('.go').disabled = pin.length < 4;
}
function showLock() {
  closePlayer();
  $('lock').classList.add('on');
  document.body.classList.add('lock');
  pin = '';
  drawPin('');
  if (usingKeys) focusEl($('keypad').querySelector('button'));
}
async function unlock() {
  if (pin.length < 4) return;
  const tried = pin;
  pin = '';
  drawPin('');
  const r = await fetch('/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: tried }) }).catch(() => null);
  const d = r ? await r.json().catch(() => ({})) : { error: 'Can’t reach the computer. Is HOMEFLIX running?' };
  if (r && r.ok) {
    try { if (d.key) localStorage.setItem('key', d.key); } catch {}
    $('lock').classList.remove('on');
    document.body.classList.remove('lock');
    return boot();
  }
  drawPin(d.error || 'Wrong PIN. Try again.');
  $('lock').classList.remove('shake'); void $('lock').offsetWidth; $('lock').classList.add('shake');
}
function pinKey(k) {
  if (k === 'del') pin = pin.slice(0, -1);
  else if (k === 'go') return unlock();
  else if (pin.length < PIN_MAX) pin += k;
  drawPin();
}
$('keypad').innerHTML = [...'123456789'].map((d) => `<button data-pin="${d}">${d}</button>`).join('') +
  '<button data-pin="del" aria-label="Delete">⌫</button><button data-pin="0">0</button><button data-pin="go" class="go">OK</button>';
$('keypad').addEventListener('click', (e) => { const b = e.target.closest('[data-pin]'); if (b) pinKey(b.dataset.pin); });
// Number keys on a keyboard or TV remote type the PIN; Enter unlocks; Backspace deletes.
document.addEventListener('keydown', (e) => {
  if (!$('lock').classList.contains('on')) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); pinKey(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); e.stopImmediatePropagation(); pinKey('del'); }
  else if (e.key === 'Enter' && !document.activeElement.closest('#keypad')) { e.preventDefault(); e.stopImmediatePropagation(); pinKey('go'); }
}, true);

// Profiles first (picked once per device, or asked when there are several), then the page.
// Signed in? Then profiles (picked once per device, or asked when there are several), then the page.
async function boot() {
  try {
    user = (await api('/api/me')).user;
    await loadProfiles();
  } catch (e) {
    if (/PIN|Sign in/.test(e.message)) return; // the PIN or sign-in screen is up
    $('rows').innerHTML = '<div class="empty error" style="padding-top:140px">Can’t reach the laptop. Is HOMEFLIX running?</div>';
    return;
  }
  if (!profile) return showProfiles();
  route();
}

// Ask for the PIN first when one is set and this device hasn't got in yet.
fetch('/api/auth').then((r) => r.json()).catch(() => ({})).then((a) => {
  if (a.pin && !a.ok) {
    try { localStorage.removeItem('key'); } catch {}
    return showLock();
  }
  boot();
});
</script>
